<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>test1</title>

  <style>
    :root{
      --page-max: 540px;
      --bg: #0f141a;
    }

    html, body{
      margin:0;
      padding:0;
      background: var(--bg);
    }

    .wrap{
      max-width: var(--page-max);
      margin: 0 auto;
      background: #000;
    }

    img{
      display:block;
      width:100%;
      height:auto;
    }

    /* ===============================
       단락텍스트9 전용 클릭 영역
       =============================== */
    .image-box{
      position: relative;
    }

    .click-area{
      position: absolute;
      z-index: 10;
      cursor: pointer;
      pointer-events: auto;

      /* 위치 확인용 (맞춘 뒤 주석 처리) */
      /* background: rgba(255,0,0,0.25); */
    }

    /* ① 우리가 알려줄게! */
    .click-area.banner{
      left: 8%;
      width: 84%;
      top: 30%;
      height: 20%;
    }

    /* ② 지금 바로 무료로 확인하세요! */
    .click-area.cta{
      left: 20%;
      width: 60%;
      bottom: 8%;
      height: 14%;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <img src="./img/단락텍스트1.png" alt="1">
    <img src="./img/단락텍스트2.png" alt="2">
    <img src="./img/단락텍스트3.png" alt="3">
    <img src="./img/단락텍스트4.png" alt="4">
    <img src="./img/단락텍스트5.png" alt="5">
    <img src="./img/단락텍스트6.png" alt="6">
    <img src="./img/단락텍스트7.png" alt="7">
    <img src="./img/단락텍스트8.png" alt="8">

    <!-- ===== 단락텍스트9 ===== -->
    <div class="image-box">
      <img src="./img/단락텍스트9.png" alt="9">

      <!-- 우리가 알려줄게! -->
      <div class="click-area banner"
           onclick="onBannerClick()"></div>

      <!-- 지금 바로 무료로 확인하세요! -->
      <div class="click-area cta"
           onclick="onCtaClick()"></div>
    </div>
  </main>

  <script>
    function onBannerClick(){
      alert('우리가 알려줄게!');
    }

    function onCtaClick(){
      alert('지금 바로 무료로 확인하세요!');
    }
  </script>
</body>
</html>
