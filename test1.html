<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 기본 스타일 */
        body {
            margin: 0;
            padding: 0;
        }

        /* 이미지를 감싸는 컨테이너 */
        .image-container {
            position: relative; /* 자식 요소의 절대 위치 기준점 */
            width: 100%;
            max-width: 600px; /* 원하시는 최대 너비 설정 */
            margin: 0 auto;
        }

        /* 이미지 스타일 */
        .image-container img {
            width: 100%;
            display: block;
            border: 0; /* 이미지 간 혹시 모를 여백 제거 */
        }

        /* 클릭 영역(투명 버튼) 스타일 - 9번 이미지 전용 */
        .click-zone {
            position: absolute;
            display: block;
            cursor: pointer;
            
            /* 위치값 */
            top: 48%; 
            left: 6%;
            width: 88%;
            height: 20%;
            
            /* 테스트용 배경색 (현재 주석 처리됨 - 투명) */
            /* background-color: rgba(255, 0, 0, 0.3); */
            
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="image-container"><img src="./img/단락텍스트1.png" alt="이미지1"></div>
    <div class="image-container"><img src="./img/단락텍스트2.png" alt="이미지2"></div>
    <div class="image-container"><img src="./img/단락텍스트3.png" alt="이미지3"></div>
    <div class="image-container"><img src="./img/단락텍스트4.png" alt="이미지4"></div>
    <div class="image-container"><img src="./img/단락텍스트5.png" alt="이미지5"></div>
    <div class="image-container"><img src="./img/단락텍스트6.png" alt="이미지6"></div>
    <div class="image-container"><img src="./img/단락텍스트7.png" alt="이미지7"></div>
    <div class="image-container"><img src="./img/단락텍스트8.png" alt="이미지8"></div>

    <div class="image-container">
        <img src="./img/단락텍스트9.png" alt="이미지9">
        <a href="http://choharu.co.kr" class="click-zone" title="자세히 보기"></a>
    </div>

</body>
</html>
