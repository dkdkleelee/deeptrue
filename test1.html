<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>test1</title>

  <style>
    :root{
      --page-max: 540px;
      --bg: #0f141a;
    }

    html, body {
      margin:0;
      padding:0;
      background: var(--bg);
    }

    .wrap{
      max-width: var(--page-max);
      margin: 0 auto;
      background: #000;
    }

    img{
      display:block;
      width:100%;
      height:auto;
    }

    /* === 단락텍스트9 전용 === */
    .image-box{
      position: relative;
    }

    .click-area{
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 12%;
      height: 18%;
      cursor: pointer;
      /* 디버깅용 (확인 후 제거) */
      /* background: rgba(255,0,0,0.2); */
    }
  </style>
</head>

<body>
  <main class="wrap">
    <img src="./img/단락텍스트1.png">
    <img src="./img/단락텍스트2.png">
    <img src="./img/단락텍스트3.png">
    <img src="./img/단락텍스트4.png">
    <img src="./img/단락텍스트5.png">
    <img src="./img/단락텍스트6.png">
    <img src="./img/단락텍스트7.png">
    <img src="./img/단락텍스트8.png">

    <!-- 🔽 단락텍스트9 -->
    <div class="image-box">
      <img src="./img/단락텍스트9.png" alt="9">

      <div class="click-area"
           onclick="alert('무료로 확인합니다!')">
      </div>
    </div>
  </main>
</body>
</html>
